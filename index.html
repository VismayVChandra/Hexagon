<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hexagon — study, together and quietly</title>
    <meta name="description" content="A calm study companion: start a session in seconds, focus alongside friends, track effort by subject and prepare for exams. Your data stays on your device." />
    <meta name="theme-color" content="#F7F1E5" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hexagon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var pref = 'system';
          var skin = 'quiet';
          var raw = localStorage.getItem('hexagon.v1');
          if (raw) {
            var st = JSON.parse(raw).settings || {};
            if (st.theme === 'light' || st.theme === 'dark') pref = st.theme;
            if (st.skin === 'pop') skin = 'pop';
            if (st.readable === true) document.documentElement.dataset.readable = 'on';
          }
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.skin = skin;
          var colors = { quiet: ['#F7F1E5', '#0E1916'], pop: ['#FFF6DF', '#17140D'] };
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', colors[skin][dark ? 1 : 0]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Shared rounded-hexagon clip-path (0..1 box) used by every hex-shaped element via clip-path: url(#hex-round) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="hex-round" clipPathUnits="objectBoundingBox">
          <path d="M0.4001 0.0500Q0.5000 0.0000 0.5999 0.0500L0.9001 0.2000Q1.0000 0.2500 1.0000 0.3500L1.0000 0.6500Q1.0000 0.7500 0.9001 0.8000L0.5999 0.9500Q0.5000 1.0000 0.4001 0.9500L0.0999 0.8000Q0.0000 0.7500 0.0000 0.6500L0.0000 0.3500Q0.0000 0.2500 0.0999 0.2000Z" />
        </clipPath>
      </defs>
    </svg>
    <div id="root">
      <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #555">Loading Hexagon…</p>
    </div>
    <noscript>Hexagon needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
